<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI booking assistant</title>
<meta name="description" content="Interactive mock-up of an AI WhatsApp assistant for dive centres: answers from the live catalogue, remembers each customer, leads to the online booking and hands over to a person when needed. Fictitious data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Mock-up of the AI booking assistant (no server, no keys, made-up data), in English and Spanish.
  Language: English by default, ?lang=es or ?lang=en in the URL, and the viewer's choice is kept in localStorage.
  Conversations are scripted in GUIONES[lang]: each step is a message from the customer, the assistant or a person,
  plus the "tools" the assistant calls before answering, which appear in the "Under the hood" panel.
-->
<style>
:root {
  --fondo: #f3f5f8; --tarjeta: #ffffff; --tinta: #14213a; --suave: #5d6880; --linea: #e2e7ef;
  --acento: #0f8a6c; --acento-2: #12a37f; --acento-tenue: #e3f4ee;
  --chat-fondo: #ece5dd; --burbuja-cli: #d9fdd3; --burbuja-bot: #ffffff; --chat-cab: #0f6b57;
  --herr: #2f6fd1; --herr-tenue: #e7effc; --memo: #8a55c9; --memo-tenue: #f1e9fa; --humano: #d9822b; --humano-tenue: #fcefe1;
  --ok: #1f9d55;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0d1420; --tarjeta: #151f2e; --tinta: #e6ebf3; --suave: #97a3b8; --linea: #263347;
    --acento: #2bc29b; --acento-2: #3dd4ac; --acento-tenue: #12352d;
    --chat-fondo: #0b141a; --burbuja-cli: #005c4b; --burbuja-bot: #1f2c34; --chat-cab: #1f2c34;
    --herr: #6ea2f5; --herr-tenue: #1a2a44; --memo: #b98ae8; --memo-tenue: #2a1f3a; --humano: #f0a65c; --humano-tenue: #3a2a18;
    --ok: #4cc27f;
  }
}
:root[data-theme="dark"] {
  --fondo: #0d1420; --tarjeta: #151f2e; --tinta: #e6ebf3; --suave: #97a3b8; --linea: #263347;
  --acento: #2bc29b; --acento-2: #3dd4ac; --acento-tenue: #12352d;
  --chat-fondo: #0b141a; --burbuja-cli: #005c4b; --burbuja-bot: #1f2c34; --chat-cab: #1f2c34;
  --herr: #6ea2f5; --herr-tenue: #1a2a44; --memo: #b98ae8; --memo-tenue: #2a1f3a; --humano: #f0a65c; --humano-tenue: #3a2a18;
  --ok: #4cc27f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font: 16px/1.55 Inter, system-ui, -apple-system, sans-serif; }
.envoltorio { max-width: 1120px; margin: 0 auto; padding: 32px 16px 56px; }
.arriba { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
header .etiqueta { display: inline-block; font-size: 13px; font-weight: 600; color: var(--acento); background: var(--acento-tenue); padding: 3px 10px; border-radius: 99px; }
.idioma { display: inline-flex; border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; background: var(--tarjeta); }
.idioma button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--suave); padding: 6px 12px; cursor: pointer; }
.idioma button[aria-pressed="true"] { background: var(--acento); color: #fff; }
h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; margin: 12px 0 10px; letter-spacing: -.01em; }
.entradilla { color: var(--suave); max-width: 720px; margin: 0 0 22px; }
.escenarios { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.escenarios button { font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--linea); background: var(--tarjeta); color: var(--tinta); padding: 8px 14px; border-radius: 99px; cursor: pointer; }
.escenarios button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: #fff; }
.escenarios button:focus-visible, .controles button:focus-visible, .sugerencia:focus-visible, .idioma button:focus-visible { outline: 3px solid var(--acento-2); outline-offset: 2px; }

.escena { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 24px; align-items: start; }
@media (max-width: 820px) { .escena { grid-template-columns: 1fr; } }

/* Phone with the chat */
.movil { background: #111; border-radius: 34px; padding: 10px; box-shadow: 0 18px 40px rgba(10, 20, 40, .18); max-width: 380px; width: 100%; margin: 0 auto; }
.pantalla { border-radius: 26px; overflow: hidden; background: var(--chat-fondo); display: flex; flex-direction: column; height: 620px; }
@media (max-width: 420px) { .pantalla { height: 560px; } }
.chat-cab { background: var(--chat-cab); color: #fff; display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--chat-cab); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.chat-cab b { display: block; font-size: 15px; line-height: 1.2; }
.chat-cab small { opacity: .8; font-size: 12px; }
.mensajes { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
.msg { max-width: 84%; padding: 7px 10px 5px; border-radius: 10px; font-size: 14.5px; line-height: 1.4; box-shadow: 0 1px .5px rgba(0,0,0,.13); white-space: pre-line; animation: entra .25s ease-out; color: var(--tinta); overflow-wrap: anywhere; }
.msg .h { display: block; text-align: right; font-size: 11px; color: var(--suave); margin-top: 2px; }
.msg.cli { align-self: flex-end; background: var(--burbuja-cli); border-top-right-radius: 3px; }
.msg.bot { align-self: flex-start; background: var(--burbuja-bot); border-top-left-radius: 3px; }
.msg.persona { align-self: flex-start; background: var(--burbuja-bot); border-left: 3px solid var(--humano); border-top-left-radius: 3px; }
.msg.persona .quien { display: block; font-size: 12px; font-weight: 600; color: var(--humano); }
.msg .enlace { display: block; margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--acento-tenue); color: var(--acento); font-weight: 600; font-size: 13.5px; }
.aviso { align-self: center; font-size: 12px; background: var(--tarjeta); color: var(--suave); padding: 4px 10px; border-radius: 8px; text-align: center; animation: entra .25s ease-out; }
.aviso.ok { color: var(--ok); font-weight: 600; }
.escribiendo { align-self: flex-start; background: var(--burbuja-bot); border-radius: 10px; padding: 10px 12px; display: flex; gap: 4px; }
.escribiendo i { width: 7px; height: 7px; border-radius: 50%; background: var(--suave); animation: bota 1s infinite; }
.escribiendo i:nth-child(2) { animation-delay: .15s; } .escribiendo i:nth-child(3) { animation-delay: .3s; }
.pie-chat { padding: 8px; display: flex; gap: 6px; min-height: 52px; align-items: center; }
.sugerencia { flex: 1; font: inherit; font-size: 14px; text-align: left; border: 0; border-radius: 22px; padding: 10px 14px; background: var(--burbuja-bot); color: var(--tinta); cursor: pointer; }
.sugerencia::before { content: attr(data-pista); color: var(--suave); font-size: 12px; }
.sugerencia:disabled { cursor: default; opacity: .6; }
.sugerencia:disabled::before { content: ""; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes bota { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

/* "Under the hood" panel */
.panel { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 14px; padding: 18px; min-width: 0; }
.panel h2 { font-size: 17px; margin: 0 0 2px; }
.panel .sub { color: var(--suave); font-size: 14px; margin: 0 0 14px; }
.contadores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
@media (max-width: 520px) { .contadores { grid-template-columns: repeat(2, 1fr); } }
.contadores div { background: var(--fondo); border-radius: 10px; padding: 10px; }
.contadores b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.contadores span { font-size: 12px; color: var(--suave); }
.registro { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 470px; overflow-y: auto; }
.registro li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px; border-radius: 10px; background: var(--fondo); animation: entra .25s ease-out; font-size: 14px; }
.registro li.vacio { display: block; background: none; padding: 0; color: var(--suave); }
.registro .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.registro .ico svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.registro b { display: block; font-size: 13.5px; }
.registro code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; color: var(--suave); overflow-wrap: anywhere; }
.registro p { margin: 2px 0 0; color: var(--suave); }
.t-memoria .ico { background: var(--memo-tenue); color: var(--memo); }
.t-herramienta .ico { background: var(--herr-tenue); color: var(--herr); }
.t-enlace .ico, .t-ok .ico { background: var(--acento-tenue); color: var(--acento); }
.t-humano .ico { background: var(--humano-tenue); color: var(--humano); }
.controles { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.controles button { font: inherit; font-size: 14px; border: 1px solid var(--linea); background: var(--tarjeta); color: var(--tinta); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.controles label { font-size: 14px; color: var(--suave); display: flex; align-items: center; gap: 6px; }

/* How it is designed */
.como { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.como div { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; padding: 16px; }
.como h3 { font-size: 15px; margin: 0 0 6px; }
.como p { margin: 0; color: var(--suave); font-size: 14px; }
h2.secc { font-size: 22px; margin: 44px 0 4px; }
.nota { color: var(--suave); font-size: 13px; margin-top: 28px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="envoltorio">
  <header>
    <div class="arriba">
      <span class="etiqueta" data-t="etiqueta"></span>
      <div class="idioma" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="es" lang="es">ES</button>
      </div>
    </div>
    <h1 data-t="titulo"></h1>
    <p class="entradilla" data-t="entradilla"></p>
  </header>

  <div class="escenarios" role="group" id="escenarios"></div>

  <div class="escena">
    <div class="movil">
      <div class="pantalla">
        <div class="chat-cab">
          <div class="avatar" aria-hidden="true">DC</div>
          <div><b data-t="centro"></b><small id="estado"></small></div>
        </div>
        <div class="mensajes" id="mensajes" aria-live="polite"></div>
        <div class="pie-chat"><button class="sugerencia" id="sugerencia" type="button" disabled></button></div>
      </div>
    </div>

    <section class="panel" aria-labelledby="t-panel">
      <h2 id="t-panel" data-t="panel"></h2>
      <p class="sub" data-t="panelSub"></p>
      <div class="contadores">
        <div><b id="c-conv">0</b><span data-t="cConv"></span></div>
        <div><b id="c-res">0</b><span data-t="cRes"></span></div>
        <div><b id="c-hum">0</b><span data-t="cHum"></span></div>
        <div><b id="c-coste">0</b><span data-t="cCoste"></span></div>
      </div>
      <ol class="registro" id="registro"></ol>
      <div class="controles">
        <button type="button" id="b-repetir" data-t="repetir"></button>
        <label><input type="checkbox" id="auto" checked> <span data-t="auto"></span></label>
      </div>
    </section>
  </div>

  <h2 class="secc" data-t="comoTitulo"></h2>
  <div class="como" id="como"></div>
  <p class="nota" data-t="nota"></p>
</div>

<script>
(function () {
  // Interface texts in each language
  var T = {
    en: {
      titulo: 'AI booking assistant for dive centres', etiqueta: 'Interactive mock-up · fictitious data',
      entradilla: 'It replies on WhatsApp or on the website with the centre\'s real catalogue and free places, remembers each customer, sends the booking link already filled in and hands the conversation over to a person when needed. Pick a conversation and tap the customer\'s messages to see what the assistant does under the hood.',
      escenarios: 'Sample conversations', centro: 'Demo Dive Centre', enLinea: 'assistant · online', escribiendo: 'assistant · typing…',
      equipoEscribiendo: 'centre team · typing…', equipoEnLinea: 'centre team · online',
      panel: 'Under the hood', panelSub: 'What the assistant looks up before answering. It never makes up a price or a place: it reads them from the booking system.',
      cConv: 'conversations', cRes: 'led to a booking', cHum: 'handed to a person', cCoste: 'AI cost', moneda: function (c) { return c.toFixed(1) + ' c€'; },
      repetir: 'Replay conversation', auto: 'Send the customer\'s messages automatically',
      pista: 'Tap to send · ', fin: 'End of the conversation. Try another one above.',
      vacio: 'Nothing yet. Tap the customer\'s first message.',
      aviso: 'Messages are answered by an AI assistant. Type "person" to talk to the team.',
      comoTitulo: 'How it is designed',
      como: [
        ['Live catalogue', 'The AI uses tools (tool use) that read activities, prices and free slots from the booking system at that moment. If a price changes, the assistant knows.'],
        ['Per-customer memory', 'On WhatsApp the customer is recognised by their number; on the website, by a cookie. It keeps a summary of each conversation and what they have booked, deleted after a while (GDPR).'],
        ['Leads to the booking', 'It never takes payment in the chat: it sends the booking widget link with activity, day, time and party size filled in, and the customer pays by card or Bizum as usual.'],
        ['Hands over to a person', 'Medical questions, complaints, large groups or when the customer asks: the assistant goes quiet, alerts the centre and the conversation carries on from the dashboard with full context.'],
        ['Languages', 'It replies in the language the customer writes in, activity names included.'],
        ['Cost', 'With a small model, a fraction of a cent per conversation. Replying on WhatsApp to someone who wrote first has no Meta charge within 24 hours.']
      ],
      nota: 'Mock-up with scripted conversations to show the design: there is no real AI, server or anyone\'s data here. The centre, prices, names and addresses are made up.'
    },
    es: {
      titulo: 'Asistente de reservas con IA para centros de buceo', etiqueta: 'Boceto interactivo · datos ficticios',
      entradilla: 'Contesta por WhatsApp o en la web con el catálogo y las plazas reales del centro, recuerda a cada cliente, le manda el enlace de reserva ya rellenado y pasa la conversación a una persona cuando hace falta. Elige una conversación y toca los mensajes del cliente para ver qué hace el asistente por dentro.',
      escenarios: 'Conversaciones de ejemplo', centro: 'Centro de Buceo Demo', enLinea: 'asistente · en línea', escribiendo: 'asistente · escribiendo…',
      equipoEscribiendo: 'equipo del centro · escribiendo…', equipoEnLinea: 'equipo del centro · en línea',
      panel: 'Por dentro', panelSub: 'Lo que consulta el asistente antes de contestar. Nunca se inventa un precio ni una plaza: los lee del sistema de reservas.',
      cConv: 'conversaciones', cRes: 'llevadas a reservar', cHum: 'pasadas a persona', cCoste: 'coste de IA', moneda: function (c) { return c.toFixed(1).replace('.', ',') + ' c€'; },
      repetir: 'Repetir conversación', auto: 'Enviar solo los mensajes del cliente',
      pista: 'Toca para enviar · ', fin: 'Fin de la conversación. Prueba otra arriba.',
      vacio: 'Aún no ha pasado nada. Toca el primer mensaje del cliente.',
      aviso: 'Los mensajes los contesta un asistente con IA. Escribe «persona» para hablar con el equipo.',
      comoTitulo: 'Cómo está pensado',
      como: [
        ['Catálogo en vivo', 'La IA usa herramientas (tool use) que leen las actividades, los precios y los huecos libres del sistema de reservas en el momento. Si cambia un precio, el asistente lo sabe.'],
        ['Memoria por cliente', 'En WhatsApp el cliente se reconoce por su número; en la web, por una cookie. Guarda un resumen de cada conversación y lo que ya ha reservado, y se borra pasado un tiempo (RGPD).'],
        ['Lleva a la reserva', 'No cobra en el chat: manda el enlace del widget con la actividad, el día, la hora y las personas ya puestas, y el cliente paga con tarjeta o Bizum como siempre.'],
        ['Pasa a una persona', 'Preguntas médicas, quejas, grupos grandes o si el cliente lo pide: el asistente se calla, avisa al centro y la conversación sigue desde el panel con todo el contexto.'],
        ['Idiomas', 'Contesta en el idioma en que le escriben, también los nombres de las actividades.'],
        ['Coste', 'Con un modelo pequeño, unas décimas de céntimo por conversación. Contestar en WhatsApp a quien escribe primero no tiene coste de Meta dentro de las 24 h.']
      ],
      nota: 'Boceto con conversaciones guionizadas para enseñar el diseño: aquí no hay IA real, servidor ni datos de nadie. El centro, los precios, los nombres y las direcciones son inventados.'
    }
  };

  // Icons (24×24 strokes) for the "Under the hood" log
  var ICONOS = {
    memoria: 'M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2 4.5V17h8v-3.5c.8-.9 2-2.3 2-4.5a6 6 0 0 0-6-6zM9 21h6',
    herramienta: 'M4 6h16M4 12h16M4 18h10',
    enlace: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
    humano: 'M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1',
    ok: 'M5 12l4 4 10-10'
  };

  // Scripts per language. tipo: cli (customer), bot, persona (staff), aviso (notice); "usa" = tools shown in the panel before the reply.
  // coste: approximate AI cost of that turn in euro cents (small model).
  var GUIONES = {
    en: [
      { id: 'bautizo', nombre: 'Try dive · new customer', pasos: [
        { tipo: 'cli', texto: 'Hi! How much is a try dive? There are 2 of us' },
        { tipo: 'bot', coste: .06, usa: [
          { t: 'memoria', titulo: 'Customer memory', det: 'New number: no previous conversations or bookings.' },
          { t: 'herramienta', titulo: 'catalog()', code: 'GET /p/demo-centre/w', det: 'Try dive (TRY): €69 per person, 2 h 30, age 10+, no experience needed.' }
        ], texto: 'Hi! A try dive is €69 per person, so €138 for the two of you. It takes about 2 h 30: a briefing on land, practice in shallow water and a dive of around 35 minutes with an instructor. All the gear and the photos are included.\nWhich day suits you?' },
        { tipo: 'cli', texto: 'Any space this Saturday?' },
        { tipo: 'bot', coste: .07, usa: [
          { t: 'herramienta', titulo: 'slots("TRY", Saturday)', code: 'GET /p/demo-centre/w/TRY?from=sat&to=sat', det: '09:00 → 5 places · 11:30 → 2 places · 15:00 → full' }
        ], texto: 'Yes, there are places on Saturday:\n- 09:00 (5 free)\n- 11:30 (2 free)\nThe 15:00 one is full. Which do you prefer?' },
        { tipo: 'cli', texto: 'The 9 o\'clock one' },
        { tipo: 'bot', coste: .08, usa: [
          { t: 'herramienta', titulo: 'quote("TRY", 2 adults)', code: 'POST /p/demo-centre/w/TRY/quote', det: 'Total €138.00' },
          { t: 'enlace', titulo: 'Pre-filled booking link', code: '/w/demo-centre/TRY/en?date=sat&time=09:00&pax=2', det: 'Tagged with source "Assistant" to measure how many bookings it brings.' }
        ], texto: 'Great. Here is the link with Saturday at 09:00 for 2 people already filled in. You can pay by card or Bizum and the confirmation arrives straight away:', enlace: 'Book try dive · Sat 09:00 · 2 people · €138' },
        { tipo: 'aviso', clase: 'ok', texto: 'Booking TRY-4821 paid with Bizum', reserva: true, usa: [
          { t: 'ok', titulo: 'Booking confirmed', det: 'Customer memory now holds: try dive on Saturday, 2 people.' }
        ] },
        { tipo: 'bot', coste: .03, texto: 'All set, you\'re booked! Bring swimwear, a towel and flip-flops, and arrive 15 minutes early. If you get seasick, take a travel pill 30 minutes before. See you on Saturday! 🤿' }
      ] },
      { id: 'vuelve', nombre: 'Returning customer', pasos: [
        { tipo: 'cli', texto: 'Hi, it\'s Lucy again. What can I do now that I have my Open Water?' },
        { tipo: 'bot', coste: .07, usa: [
          { t: 'memoria', titulo: 'Customer memory', det: 'Lucy · Open Water certified here in August · 4 dives with the centre · prefers morning trips.' },
          { t: 'herramienta', titulo: 'catalog()', code: 'GET /p/demo-centre/w', det: 'Double boat dive (DBL) €85 · Advanced Open Water (AOW) €340 · Night dive (NGT) €60' }
        ], texto: 'Hi Lucy! Lovely to hear from you again. With your Open Water you can do:\n- Double boat dive at two sites around the island: €85\n- Advanced Open Water (2 days, down to 30 m): €340\n- Night dive: €60\nLast time you preferred mornings, shall I check the 09:00 double dive?' },
        { tipo: 'cli', texto: 'Yes, on Sunday' },
        { tipo: 'bot', coste: .07, usa: [
          { t: 'herramienta', titulo: 'slots("DBL", Sunday)', code: 'GET /p/demo-centre/w/DBL?from=sun&to=sun', det: '09:00 → 3 places' },
          { t: 'enlace', titulo: 'Pre-filled booking link', code: '/w/demo-centre/DBL/en?date=sun&time=09:00&pax=1', det: 'The centre already has her details: she only confirms and pays.' }
        ], texto: 'There are 3 places on Sunday at 09:00. I\'ve got the booking ready for you; as a returning customer your details are already in:', enlace: 'Book double dive · Sun 09:00 · 1 person · €85' },
        { tipo: 'aviso', clase: 'ok', texto: 'Booking DBL-1307 paid by card', reserva: true, usa: [
          { t: 'ok', titulo: 'Booking confirmed', det: 'Memory adds her fifth dive with the centre.' }
        ] }
      ] },

  var $ = function (id) { return document.getElementById(id); };
  var quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lang, L, guion, paso, temporizador, turno = 0, ocupado = false, enManos = false;
  var cont = { conv: 0, res: 0, hum: 0, coste: 0 };
  var vistos = {};

  function hora() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bajar() { var m = $('mensajes'); m.scrollTop = m.scrollHeight; }
  function espera(ms) { return new Promise(function (r) { temporizador = setTimeout(r, quieto ? 0 : ms); }); }
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function pintarContadores() {
    $('c-conv').textContent = cont.conv; $('c-res').textContent = cont.res; $('c-hum').textContent = cont.hum;
    $('c-coste').textContent = L.moneda(cont.coste);
  }

  function burbuja(p) {
    var d = document.createElement('div');
    if (p.tipo === 'aviso') { d.className = 'aviso' + (p.clase ? ' ' + p.clase : ''); d.textContent = p.texto; }
    else {
      d.className = 'msg ' + p.tipo;
      d.innerHTML = (p.quien ? '<span class="quien">' + esc(p.quien) + '</span>' : '') + esc(p.texto) +
        (p.enlace ? '<span class="enlace">🔗 ' + esc(p.enlace) + '</span>' : '') + '<span class="h">' + hora() + '</span>';
    }
    $('mensajes').appendChild(d); bajar();
  }

  function apunte(u) {
    var r = $('registro'), v = r.querySelector('.vacio'); if (v) v.remove();
    var li = document.createElement('li'); li.className = 't-' + u.t;
    li.innerHTML = '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + ICONOS[u.t] + '"/></svg></span><div><b>' + esc(u.titulo) + '</b>' +
      (u.code ? '<code>' + esc(u.code) + '</code>' : '') + '<p>' + esc(u.det) + '</p></div>';
    r.appendChild(li); r.scrollTop = r.scrollHeight;
  }

  // Plays until the next customer message (left as a suggestion) or the end. "mio" stops an old run when the conversation or language changes.
  async function seguir() {
    var mio = turno; ocupado = true;
    var b = $('sugerencia'); b.disabled = true; b.textContent = '';
    while (paso < guion.pasos.length) {
      var p = guion.pasos[paso];
      if (p.tipo === 'cli') {
        b.textContent = p.texto; b.disabled = false; ocupado = false;
        if ($('auto').checked) { await espera(2200); if (mio === turno && !ocupado && guion.pasos[paso] === p) enviar(); }
        return;
      }
      if (p.usa) for (var i = 0; i < p.usa.length; i++) { await espera(650); if (mio !== turno) return; apunte(p.usa[i]); }
      if (p.tipo === 'bot' || p.tipo === 'persona') {
        $('estado').textContent = p.tipo === 'persona' ? L.equipoEscribiendo : L.escribiendo;
        var e = document.createElement('div'); e.className = 'escribiendo'; e.innerHTML = '<i></i><i></i><i></i>';
        $('mensajes').appendChild(e); bajar();
        await espera(p.tipo === 'persona' ? 1800 : 1100); e.remove(); if (mio !== turno) return;
      } else { await espera(400); if (mio !== turno) return; }
      burbuja(p);
      if (p.coste) cont.coste += p.coste;
      if (p.reserva) cont.res++;
      if (p.humano) { cont.hum++; enManos = true; }
      $('estado').textContent = enManos ? L.equipoEnLinea : L.enLinea;
      pintarContadores(); paso++;
    }
    b.textContent = L.fin; ocupado = false;
  }

  function enviar() {
    if (ocupado) return; var p = guion.pasos[paso]; if (!p || p.tipo !== 'cli') return;
    clearTimeout(temporizador);
    if (!vistos[guion.id]) { vistos[guion.id] = true; cont.conv++; pintarContadores(); }
    burbuja(p); paso++; seguir();
  }

  function empezar(id) {
    clearTimeout(temporizador); turno++; ocupado = false; enManos = false;
    guion = GUIONES[lang].filter(function (g) { return g.id === id; })[0]; paso = 0;
    $('mensajes').innerHTML = ''; $('estado').textContent = L.enLinea;
    $('registro').innerHTML = '<li class="vacio">' + esc(L.vacio) + '</li>';
    Array.prototype.forEach.call($('escenarios').children, function (b) { b.setAttribute('aria-pressed', b.dataset.id === id); });
    var a = document.createElement('div'); a.className = 'aviso'; a.textContent = L.aviso;
    $('mensajes').appendChild(a);
    seguir();
  }

  // Changes the language of everything and restarts the current conversation in that language
  function ponerIdioma(nuevo) {
    lang = nuevo; L = T[lang]; guardar('asistente-idioma', lang);
    document.documentElement.lang = lang; document.title = L.titulo.replace(/ for .*| para .*/, '');
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (n) { n.textContent = L[n.dataset.t]; });
    Array.prototype.forEach.call(document.querySelectorAll('.idioma button'), function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang); });
    $('escenarios').setAttribute('aria-label', L.escenarios);
    $('sugerencia').setAttribute('data-pista', L.pista);
    $('como').innerHTML = L.como.map(function (c) { return '<div><h3>' + esc(c[0]) + '</h3><p>' + esc(c[1]) + '</p></div>'; }).join('');
    var actual = guion ? guion.id : 'bautizo';
    $('escenarios').innerHTML = '';
    GUIONES[lang].forEach(function (g) {
      var b = document.createElement('button'); b.type = 'button'; b.dataset.id = g.id; b.textContent = g.nombre;
      b.addEventListener('click', function () { empezar(g.id); });
      $('escenarios').appendChild(b);
    });
    pintarContadores(); empezar(actual);
  }

  var deUrl = (location.search.match(/[?&]lang=(en|es)\b/) || [])[1];
  var inicial = deUrl || leer('asistente-idioma');
  Array.prototype.forEach.call(document.querySelectorAll('.idioma button'), function (b) {
    b.addEventListener('click', function () { if (b.dataset.lang !== lang) ponerIdioma(b.dataset.lang); });
  });
  $('sugerencia').addEventListener('click', enviar);
  $('b-repetir').addEventListener('click', function () { empezar(guion.id); });
  $('auto').addEventListener('change', function () { if ($('auto').checked && !ocupado) { var p = guion.pasos[paso]; if (p && p.tipo === 'cli') { clearTimeout(temporizador); temporizador = setTimeout(enviar, quieto ? 0 : 1200); } } });
  ponerIdioma(T[inicial] ? inicial : 'en');
})();
